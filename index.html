*{box-sizing:border-box}

details summary{cursor:pointer;color:var(--sub);font-size:13px}
.gb{display:inline-block;min-width:26px;text-align:center;font-size:12px;font-weight:800;padding:1px 6px;border-radius:6px;border:1px solid var(--line);color:var(--sub)}
.gb.g-低{color:var(--low);border-color:var(--low-bd)}.gb.g-中{color:var(--gold);border-color:var(--mid-bd)}.gb.g-高{color:var(--green);border-color:var(--hi-bd)}

[data-nav]{cursor:pointer;-webkit-tap-highlight-color:var(--tap)}

th{white-space:nowrap}td .small,td .dim{white-space:nowrap}
details.month>summary{display:flex;align-items:center;gap:6px;color:var(--text);font-size:14px}
